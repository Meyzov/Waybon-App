<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="maplibre-gl.css" rel="stylesheet" />
    <script src="maplibre-gl.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #fafaf9;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
        }

        .maplibregl-canvas {
            outline: none;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script id="map-style" type="application/json">MAP_STYLE_JSON_PLACEHOLDER</script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const style = JSON.parse(document.getElementById('map-style').textContent);

            var map = new maplibregl.Map({
                container: 'map',
                style: style,
                center: [-79.4069, 9.0484],
                zoom: 16,
                pitch: 0,
                bearing: 0,
                dragRotate: true,
                pitchWithRotate: true,
                touchPitch: true,
                attributionControl: false,
                fadeDuration: 0,
                refreshExpiredTiles: false,
                crossSourceCollisions: false,
                maxTileCacheSize: 200,
                canvasContextAttributes: {
                    antialias: true
                }
            });

            setTimeout(() => map.resize(), 250);
        });
    </script>
</body>
</html>
